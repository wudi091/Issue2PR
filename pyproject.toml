[project]
name = "issue2pr"
version = "0.1.0"
description = "把仓库里的一个 issue 自动变成一份能让测试通过的补丁，并开成 PR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["issue2pr"]